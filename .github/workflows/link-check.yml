name: Link Check

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  linkcheck:
    name: Check for Broken Links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check links with Lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress --verbose --format markdown --output lychee-report.md "**/*.md"
          fail: true
        continue-on-error: true

      - name: Open issue for dead links
        if: steps.lychee.outcome == 'failure'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Dead links found in weekly link check"
          content-filepath: ./lychee-report.md
          labels: dead-links, automated

      - name: Fail job if links are broken
        if: steps.lychee.outcome == 'failure'
        run: exit 1
