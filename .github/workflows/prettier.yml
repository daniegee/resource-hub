name: Prettier

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".prettierrc*"
      - ".github/workflows/prettier.yml"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check formatting
        run: npx --yes prettier --check "**/*.md"
