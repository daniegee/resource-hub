name: Table of Contents Check

on:
  pull_request:
    paths:
      - "README.md"
      - "scripts/check-toc.mjs"
      - ".github/workflows/toc-check.yml"

jobs:
  toc:
    name: Verify Table of Contents
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check Contents section matches headings
        run: node scripts/check-toc.mjs
